name: CI - Validação Backend e Frontend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-check:
    name: Backend Syntax & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Validar compilação Python e testes de segurança
        run: |
          python -m compileall -q backend/app
          python -m pytest backend/tests/test_security_and_improvements.py -v

  frontend-build:
    name: Frontend Build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Compilar bundle de produção
        working-directory: frontend
        run: npm run build
